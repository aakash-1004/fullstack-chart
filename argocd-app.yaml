apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aakash-1004/fullstack-chart.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: fullstack-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
